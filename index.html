<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>單字卡複習</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Direction: a desk-top index card. English sits on a four-line practice staff (the kind in Taiwanese English notebooks), Chinese meanings in textbook serif, cobalt ballpoint ink as the single accent. */
:root{
  --font-display:"Andika","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-serif:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",serif;
  --bg:#0f1318; --surface:#171c23; --surface-2:#212832; --line:#2b3440;
  --fg:#e9edf2; --muted:#8c97a5; --soft:#b9c2cd;
  --ink:#8fa6ff; --on-ink:#0d1220; --paper:#1a2029; --rule:#3b4b6c; --baseline:#e2736d;
  --good:#9be3ab; --good-ink:#0d3a1b; --good-solid:#6fd08a;
  --bad:#f29090; --bad-ink:#4a1111; --bad-solid:#ef7f7f;
  --new:#38414d; --focus:#9db1ff;
  --card-shadow:0 0 0 1px #2b3440, 0 20px 40px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e7ebf0; --surface:#f6f8fa; --surface-2:#dce2e9; --line:#c9d1da;
    --fg:#14181d; --muted:#5b6672; --soft:#36404b;
    --ink:#2446d6; --on-ink:#ffffff; --paper:#ffffff; --rule:#aebfe6; --baseline:#d4574f;
    --good:#8edba3; --good-ink:#0b3a1a; --good-solid:#238a4c;
    --bad:#f19a9a; --bad-ink:#4a1111; --bad-solid:#c8403d;
    --new:#c9cfd6; --focus:#2446d6;
    --card-shadow:0 1px 2px rgba(20,30,50,.1), 0 20px 36px -20px rgba(20,30,50,.4);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e7ebf0; --surface:#f6f8fa; --surface-2:#dce2e9; --line:#c9d1da;
  --fg:#14181d; --muted:#5b6672; --soft:#36404b;
  --ink:#2446d6; --on-ink:#ffffff; --paper:#ffffff; --rule:#aebfe6; --baseline:#d4574f;
  --good:#8edba3; --good-ink:#0b3a1a; --good-solid:#238a4c;
  --bad:#f19a9a; --bad-ink:#4a1111; --bad-solid:#c8403d;
  --new:#c9cfd6; --focus:#2446d6;
  --card-shadow:0 1px 2px rgba(20,30,50,.1), 0 20px 36px -20px rgba(20,30,50,.4);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;-webkit-tap-highlight-color:transparent}
#app{height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{display:inline-flex;width:22px;height:22px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.page{max-width:640px;margin-inline:auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-serif);font-size:28px;line-height:1.25;font-weight:700;margin:0;text-wrap:balance}
h2{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.06em;margin:0 0 8px}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acct{display:flex;align-items:center;gap:8px;min-width:0}
.acct .who{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft);font-size:13px}
.topnav{display:flex;align-items:center;gap:8px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--fg)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:disabled{opacity:.35;cursor:default}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:transparent}
.btn.danger{color:var(--bad-solid)}
.btn:disabled{opacity:.4;cursor:default}
.btn.block{width:100%}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.row-actions .btn{flex:1 1 150px}

.units{background:var(--surface);border-radius:16px;overflow:hidden}
.unit{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:16px;min-width:0}
.unit:first-child{border-top:0}
.unit:hover{background:var(--surface-2)}
.unit .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.unit .name{font-family:var(--font-serif);font-weight:700;font-size:17px;overflow-wrap:anywhere}
.unit .n{font-family:var(--font-display);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend b{font-weight:500;color:var(--fg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--new)}
.dot.u{background:var(--bad-solid)} .dot.k{background:var(--good-solid)}

.stripe{display:flex;gap:1px;height:8px;width:100%}
.stripe i{flex:1 1 0;min-width:1px;background:var(--new);border-radius:1px}
.stripe i.s-k{background:var(--good-solid)}
.stripe i.s-u{background:var(--bad-solid)}
.stripe.dense{gap:0}

.empty{background:var(--surface);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.empty p{margin:0;color:var(--soft)}
.empty h2{font-family:var(--font-serif);font-size:19px;color:var(--fg);letter-spacing:0;font-weight:700;margin:0}

textarea{width:100%;min-height:200px;resize:vertical;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55}
.err{color:var(--bad-solid);font-size:14px;margin:0;overflow-wrap:anywhere}
.codebox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.codebox pre{margin:0;padding:12px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.codebox .btn{margin:0 12px 12px;min-height:38px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
details summary{cursor:pointer;color:var(--soft);padding-block:6px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--font-display);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat.u .v{color:var(--bad-solid)} .stat.k .v{color:var(--good-solid)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:36px;padding:0 14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.opt span{color:var(--soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;min-height:36px;padding:0 14px;font-size:13.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:transparent}
.words{background:var(--surface);border-radius:16px;overflow:hidden}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .w{font-family:var(--font-display);font-weight:500;font-size:16px;overflow-wrap:anywhere}
.wrow .w small{display:block;font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:400}
.wrow .m{color:var(--soft);overflow-wrap:anywhere}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.u{background:var(--bad);color:var(--bad-ink)} .chip.k{background:var(--good);color:var(--good-ink)}
.none{padding:20px;text-align:center;color:var(--muted)}

/* Study */
.study{height:100%;min-height:0;max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:10px;padding-block:12px 16px;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.scrub{flex:1;min-width:0;height:28px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;--p:0%}
.scrub::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--ink) var(--p),var(--line) var(--p))}
.scrub::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
.scrub::-moz-range-progress{height:4px;border-radius:2px;background:var(--ink)}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ink);margin-top:-8px}
.scrub::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ink)}
.pos{font-family:var(--font-display);font-size:16px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 9px;border-radius:8px;font-family:var(--font-display);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.pill .ic{width:16px;height:16px}
.pill.bad{background:var(--bad);color:var(--bad-ink)}
.pill.good{background:var(--good);color:var(--good-ink)}
.stage{position:relative;z-index:1;isolation:isolate;flex:1 1 0;min-height:0}
.card{position:absolute;inset:0;margin:auto;width:min(100%,720px);height:min(100%,560px);touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;will-change:transform}
.card:active{cursor:grabbing}
.card.enter{animation:enter .18s ease-out}
@keyframes enter{from{transform:scale(.965);opacity:.4}to{transform:none;opacity:1}}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .35s ease;perspective:1200px}
.card.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--paper);border-radius:10px;box-shadow:var(--card-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:52px 28px 72px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face::before{content:"";position:absolute;left:0;right:0;top:44px;height:1px;background:var(--baseline);opacity:.55}
.face.back{transform:rotateY(180deg)}
.tag{position:absolute;top:0;left:22px;right:22px;height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--font-display);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.tag span:first-child{color:var(--ink);font-weight:700;flex:none}
.tag span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.staff{width:100%;max-width:640px;height:auto;display:block;overflow:visible}
.staff .sl{stroke:var(--rule);stroke-width:1.25px;vector-effect:non-scaling-stroke}
.staff .sl.dash{stroke-dasharray:5 5}
.staff .sl.base{stroke:var(--baseline)}
.staff text{fill:var(--fg);font-family:var(--font-display);font-weight:400}
.big-zh{font-family:var(--font-serif);font-weight:700;font-size:clamp(30px,6.5vw,52px);line-height:1.3;overflow-wrap:anywhere;margin:0;text-wrap:balance}
.echo{font-family:var(--font-display);font-size:18px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.meta{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:1.5em}
.posc{font-family:var(--font-display);font-style:italic;font-size:14px;color:var(--ink);border:1px solid var(--ink);border-radius:4px;padding:0 8px;line-height:1.6}
.ph{font-family:var(--font-display);color:var(--muted);font-size:15px}
.ex{font-family:var(--font-display);font-style:italic;color:var(--soft);font-size:16px;line-height:1.5;max-width:30em;margin:0}
.ex small{display:block;font-style:normal;font-family:var(--font-serif);color:var(--muted);font-size:14px;margin-top:2px}
.tint{position:absolute;inset:0;border-radius:10px;opacity:0;pointer-events:none;display:flex;align-items:flex-start;justify-content:center;padding-top:56px;font-weight:700;font-size:20px;z-index:2}
.tint.good{background:color-mix(in srgb,var(--good) 24%,transparent);box-shadow:inset 0 0 0 2px var(--good-solid);color:var(--good-solid)}
.tint.bad{background:color-mix(in srgb,var(--bad) 24%,transparent);box-shadow:inset 0 0 0 2px var(--bad-solid);color:var(--bad-solid)}
.tools{position:absolute;right:16px;bottom:14px;display:flex;gap:4px;z-index:3}
.tools .iconbtn{color:var(--soft)}
.tools .iconbtn[aria-pressed="true"]{color:var(--ink);background:var(--surface-2)}
.swipehint{flex:none;display:flex;justify-content:space-between;width:100%;max-width:720px;margin-inline:auto;font-size:12.5px;letter-spacing:.04em;color:var(--muted)}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;position:relative;z-index:2;flex:none}
.bar .undo{justify-self:start;display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;min-height:48px;padding:0 10px 0 6px;border-radius:10px;font-size:15px;color:var(--soft)}
.bar .undo:hover{background:var(--surface-2)}
.bar .undo:disabled{opacity:.35;cursor:default}
.answer{display:flex;gap:12px}
.ans{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:132px;height:56px;padding:0 22px;border-radius:12px;border:0;font-size:17px;font-weight:700}
.ans .ic{width:22px;height:22px}
.ans.bad{background:var(--bad);color:var(--bad-ink)}
.ans.good{background:var(--good);color:var(--good-ink)}
.ans:active{transform:scale(.97)}

.summary{max-width:480px;margin-inline:auto;padding-block:48px;display:flex;flex-direction:column;gap:20px;align-items:stretch}
.summary .nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary .stat .v{font-size:40px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){
  .face{padding:50px 18px 66px}
  .bar{grid-template-columns:auto 1fr}
  .bar>div:last-child{display:none}
  .bar .undo .lbl{display:none}
  .answer{width:100%}
  .ans{flex:1;min-width:0}
  .wrow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .wrow .m{grid-column:1;grid-row:2}
  .wrow .chip{grid-column:2;grid-row:1 / span 2}
}
@media (prefers-reduced-motion: reduce){
  .flip,.toast{transition:none}
  .card.enter{animation:none}
}
</style>

</head>

const pending=new Map(), timers=new Map(), chains=new Map();
function saveUnit(u,now){
  pending.set(u.id,u); clearTimeout(timers.get(u.id));
  if(now) return flush(u.id);
  timers.set(u.id,setTimeout(()=>flush(u.id),600));
}
function flush(id){
  clearTimeout(timers.get(id));
  const u=pending.get(id); if(!u) return Promise.resolve();
  pending.delete(id);
  if(!dbc&&isFB()){
    const body=JSON.parse(JSON.stringify(u));
    const p=(chains.get(id)||Promise.resolve()).then(()=>FB.save(body)).catch(()=>{ toast('雲端儲存失敗，請檢查網路連線'); });
    chains.set(id,p); return Promise.resolve();
  }
  if(!dbc){ lsSave(); return Promise.resolve(); }
  const body=JSON.parse(JSON.stringify(u));
  const p=(chains.get(id)||Promise.resolve())
    .then(()=>dbc&&dbc.doc(id).set(body))
    .catch(()=>{ if(dbc){ dbc=null; state.storage='local'; lsSave(); toast('帳號儲存失敗，已改存在這個瀏覽器'); if(state.view==='home') render(); } });
  chains.set(id,p); return p;
}
function flushAll(){ for(const id of Array.from(pending.keys())) flush(id); }
function removeUnit(id){
  state.units=state.units.filter(u=>u.id!==id); pending.delete(id);
  if(dbc){ const p=(chains.get(id)||Promise.resolve()).then(()=>dbc&&dbc.doc(id).delete()).catch(()=>{ toast('刪除同步失敗，重新整理後可能還會出現'); }); chains.set(id,p); }
  else if(isFB()){ const p=(chains.get(id)||Promise.resolve()).then(()=>FB.remove(id)).catch(()=>{ toast('刪除同步失敗，重新整理後可能還會出現'); }); chains.set(id,p); }
  else lsSave();
}

});

/* ---------- import ---------- */
const PICK=(o,keys)=>{ for(const k of keys){ if(o[k]!=null && String(o[k]).trim()!=='') return String(o[k]).trim(); } return ''; };
function normWord(w){
  if(Array.isArray(w)){ if(w.length<2) return null; w={word:w[0],meaning:w[1],pos:w[2]}; }
  if(!w||typeof w!=='object') return null;
  const word=PICK(w,['word','english','en','term','vocab']);
  const meaning=PICK(w,['meaning','chinese','zh','translation','definition','cn']);
  if(!word||!meaning) return null;
  const o={word,meaning};
  const pos=PICK(w,['pos','partOfSpeech','part_of_speech']); if(pos) o.pos=pos;
  const ph=PICK(w,['phonetic','kk','ipa','pronunciation']); if(ph) o.phonetic=ph;
  const ex=PICK(w,['example','sentence','eg']); if(ex) o.example=ex;
  const exz=PICK(w,['exampleZh','example_zh','exampleMeaning','example_meaning','sentenceZh']); if(exz) o.exampleZh=exz;
  return o;
}
function parseImport(text,fallbackName){
  let t=String(text||'').trim();
  if(!t) return {error:'請先貼上 JSON 或選擇檔案。'};
  t=t.replace(/^```[a-zA-Z]*\s*/,'').replace(/\s*```$/,'').trim();
  let raw;
  try{ raw=JSON.parse(t); }catch(e){
    const a=t.indexOf('{'), b=t.lastIndexOf('}'), c=t.indexOf('['), d=t.lastIndexOf(']');
    try{
      if(a>=0&&b>a&&(c<0||a<c)) raw=JSON.parse(t.slice(a,b+1));
      else if(c>=0&&d>c) raw=JSON.parse(t.slice(c,d+1));
      else throw e;
    }catch(e2){ return {error:'這不是有效的 JSON。請確認 AI 只輸出 JSON，沒有多餘的說明文字。（'+e.message+'）'}; }
  }
  let list;
  if(Array.isArray(raw)) list=(raw.length&&raw[0]&&!Array.isArray(raw[0])&&typeof raw[0]==='object'&&Array.isArray(raw[0].words))?raw:[{name:fallbackName,words:raw}];
  else if(raw&&Array.isArray(raw.units)) list=raw.units;
  else if(raw&&Array.isArray(raw.words)) list=[raw];
  else return {error:'找不到 words 欄位。格式應為 {"name":"單元名稱","words":[{"word":"…","meaning":"…"}]}。'};
  const units=[]; let skipped=0;
  list.forEach((src,i)=>{
    const words=[]; (src.words||[]).forEach(w=>{ const n=normWord(w); if(n) words.push(n); else skipped++; });
    if(!words.length) return;
    units.push({id:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+i,name:String(src.name||src.title||fallbackName||'未命名單元').trim().slice(0,60),created:Date.now()-i,words,status:{}});
  });
  if(!units.length) return {error:'找不到可用的單字。每筆單字至少需要 word（英文）和 meaning（中文）。'};
  const big=units.find(u=>new TextEncoder().encode(JSON.stringify(u)).length>240000);
  if(big) return {error:'「'+big.name+'」太大了，請拆成多個單元（建議每個單元 500 字以內）。'};
  return {units,skipped};
}

格式如下：
{
  "name": "單元名稱",
  "words": [
    {"word": "pour", "meaning": "倒；傾瀉", "pos": "v.", "phonetic": "/pɔr/", "example": "She poured water into the glass.", "exampleZh": "她把水倒進杯子裡。"},

3. pos（詞性）、phonetic（音標）、example（例句）、exampleZh（例句翻譯）只有原文有提供時才填，沒有就整個欄位省略，不要自己編。

}

/* ---------- study session ---------- */
let S=null;
function startStudy(mode,idsOverride){
  const u=unit(); if(!u) return;
  let ids=idsOverride||u.words.map((_,i)=>i).filter(i=>mode==='all'||u.status[i]==='u');
  if(!ids.length){ toast('沒有可複習的單字'); return; }
  S={queue:ids.slice(),i:0,count:{k:0,u:0},answers:{},history:[],track:true,flipped:false,shuffled:false,busy:false};
  go('study');
}
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function speak(text){
  try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=.9; speechSynthesis.speak(u); }catch(e){}
}
function answer(res){
  const u=unit(), id=S.queue[S.i];
  const e={id,i:S.i,res,prevAns:S.answers[id],tracked:S.track,prevStatus:u.status[id]};
  if(e.prevAns) S.count[e.prevAns]--;
  S.history.push(e); S.answers[id]=res; S.count[res]++;
  if(S.track){ u.status[id]=res; saveUnit(u); }
  S.i++; S.flipped=false;
}
function undo(){
  if(!S||S.busy) return; const e=S.history.pop(); if(!e) return;
  const u=unit();
  S.count[e.res]--; if(e.prevAns){ S.answers[e.id]=e.prevAns; S.count[e.prevAns]++; } else delete S.answers[e.id];
  if(e.tracked){ if(e.prevStatus) u.status[e.id]=e.prevStatus; else delete u.status[e.id]; saveUnit(u); }
  S.i=e.i; S.flipped=false;
  if(state.view==='summary'){ state.view='study'; renderStudy(); } else { sync(true); }
}

let UI={};
function renderStudy(){
  const u=unit(); if(!u||!S){ return go('unit'); }
  const root=clear();
  const scrub=h('input',{type:'range',class:'scrub',min:'0',max:String(Math.max(0,S.queue.length-1)),value:'0','aria-label':'目前進度',oninput:e=>{ if(S.busy) return; S.i=+e.target.value; S.flipped=false; sync(true); }});
  const posEl=h('span',{class:'pos'});
  const badEl=h('span',{class:'pill bad','aria-label':'不會'},ic('x'),h('span',{text:'0'}));
  const goodEl=h('span',{class:'pill good','aria-label':'會'},ic('check'),h('span',{text:'0'}));
  const front=h('div',{class:'face front'}), back=h('div',{class:'face back'});
  const tintGood=h('div',{class:'tint good',text:'✓ 會'}), tintBad=h('div',{class:'tint bad',text:'✕ 不會'});
  const shuf=h('button',{class:'iconbtn','aria-label':'隨機排序剩下的字卡','aria-pressed':'false',onpointerdown:e=>e.stopPropagation(),onclick:e=>{
    e.stopPropagation(); S.shuffled=!S.shuffled;
    const done=S.queue.slice(0,S.i+1), rest=S.queue.slice(S.i+1);
    S.queue=done.concat(S.shuffled?shuffleArr(rest):rest.sort((a,b)=>a-b));
    shuf.setAttribute('aria-pressed',String(S.shuffled)); toast(S.shuffled?'已隨機排序剩下的字卡':'已恢復原本順序');
  }},ic('shuffle'));
  const spk=h('button',{class:'iconbtn','aria-label':'播放發音',onpointerdown:e=>e.stopPropagation(),onclick:e=>{ e.stopPropagation(); speak(u.words[S.queue[S.i]].word); }},ic('speaker'));
  const tools=h('div',{class:'tools'},shuf,spk);
  const card=h('div',{class:'card',role:'button',tabindex:'0','aria-label':'字卡，點一下翻面，向左滑表示會，向右滑表示不會'},
    h('div',{class:'flip'},front,back),tintGood,tintBad,tools);
  const undoBtn=h('button',{class:'undo','aria-label':'復原',onclick:undo},ic('undo'),h('span',{class:'lbl',text:'復原'}));
  const noBtn=h('button',{class:'ans bad','aria-label':'不會，列入待複習',onclick:()=>commit('u')},ic('x'),'不會');
  const yesBtn=h('button',{class:'ans good','aria-label':'會了',onclick:()=>commit('k')},ic('check'),'會了');
  UI={card,front,back,scrub,posEl,badEl,goodEl,undoBtn,tintGood,tintBad,shuf};
  root.append(h('div',{class:'study'},
    h('div',{class:'topbar'},h('button',{class:'iconbtn','aria-label':'結束複習',onclick:()=>{ flushAll(); go('unit'); }},ic('back')),scrub,posEl,badEl,goodEl),
    h('div',{class:'stage'},card),
    h('div',{class:'swipehint','aria-hidden':'true'},h('span',{text:'← 往左滑：會'}),h('span',{text:'往右滑：不會 →'})),
    h('div',{class:'bar'},undoBtn,h('div',{class:'answer'},noBtn,yesBtn),h('div'))));
  bindCard(card);
  sync(false);
}
const NS='http://www.w3.org/2000/svg';
function staff(text){
  const W=640,S=52,top=16,fs=S*1.8,ys=[0,1,2,3].map(i=>top+i*S);
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+(top*2+3*S)); svg.setAttribute('class','staff'); svg.setAttribute('role','img'); svg.setAttribute('aria-label',text);
  svg.dataset.s=S; svg.dataset.max=W-40;
  ys.forEach((y,i)=>{ const l=document.createElementNS(NS,'line'); l.setAttribute('x1','0'); l.setAttribute('x2',W); l.setAttribute('y1',y); l.setAttribute('y2',y); l.setAttribute('class','sl'+(i===1?' dash':'')+(i===2?' base':'')); svg.append(l); });
  const t=document.createElementNS(NS,'text'); t.setAttribute('x',W/2); t.setAttribute('y',ys[2]); t.setAttribute('text-anchor','middle'); t.textContent=text; t.style.fontSize=fs+'px'; svg.append(t);
  return svg;
}
let XC=null;
function xRatio(el){
  try{ const cs=getComputedStyle(el); XC=XC||document.createElement('canvas').getContext('2d'); XC.font='400 100px '+cs.fontFamily;
    const a=XC.measureText('x').actualBoundingBoxAscent/100; return a>0.2&&a<0.9?a:0.52; }catch(e){ return 0.52; }
}
function fitStaff(svg){
  const t=svg.querySelector('text'); if(!t||!t.getComputedTextLength) return;
  const S=+svg.dataset.s, max=+svg.dataset.max, base=S*0.95/xRatio(t); t.style.fontSize=base+'px';
  try{ const L=t.getComputedTextLength(); if(L>max) t.style.fontSize=(base*max/L)+'px'; }catch(e){}
}
function fitAll(){ document.querySelectorAll('svg.staff').forEach(fitStaff); }
if(document.fonts){ if(document.fonts.ready) document.fonts.ready.then(fitAll); if(document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',fitAll); }
function fillFaces(){
  const u=unit(), w=u.words[S.queue[S.i]];
  const tag=()=>h('div',{class:'tag'},h('span',{text:'No. '+String(S.queue[S.i]+1).padStart(3,'0')}),h('span',{text:u.name}));
  const zh=()=>h('p',{class:'big-zh',text:w.meaning});
  const meta=()=>h('div',{class:'meta'},w.pos?h('span',{class:'posc',text:w.pos}):null,w.phonetic?h('span',{class:'ph',text:w.phonetic}):null);
  const ex=()=>w.example?h('p',{class:'ex'},w.example,w.exampleZh?h('small',{text:w.exampleZh}):null):null;
  UI.front.textContent=''; UI.back.textContent='';
  if(state.front==='en'){
    UI.front.append(tag(),staff(w.word));
    UI.back.append(tag(),h('p',{class:'echo',text:w.word}),zh(),meta(),ex());
  } else {
    UI.front.append(tag(),zh());
    UI.back.append(tag(),staff(w.word),meta(),ex());
  }
  UI.card.classList.toggle('flipped',S.flipped);
  requestAnimationFrame(fitAll);
}
function sync(enter){
  if(!UI.card) return;
  const total=S.queue.length;
  fillFaces();
  UI.scrub.max=String(Math.max(0,total-1)); UI.scrub.value=String(S.i);
  UI.scrub.style.setProperty('--p',(total>1?S.i/(total-1)*100:0)+'%');
  UI.posEl.textContent=(S.i+1)+'/'+total;
  UI.badEl.lastChild.textContent=S.count.u; UI.goodEl.lastChild.textContent=S.count.k;
  UI.undoBtn.disabled=S.history.length===0;
  if(enter && !reduceMotion()){ UI.card.classList.remove('enter'); void UI.card.offsetWidth; UI.card.classList.add('enter'); }
}
function resetCardStyle(){
  const c=UI.card; c.style.transition='none'; c.style.transform=''; c.style.opacity=''; c.style.removeProperty('--x');
  UI.tintGood.style.opacity='0'; UI.tintBad.style.opacity='0';
}
function commit(res){
  if(!S||S.busy) return; S.busy=true;
  const dir=res==='k'?-1:1, dist=Math.max(window.innerWidth,600)*dir, c=UI.card;
  const ms=reduceMotion()?0:220;
  (res==='k'?UI.tintGood:UI.tintBad).style.opacity='1';
  c.style.transition=ms?`transform ${ms}ms ease-in, opacity ${ms}ms ease-in`:'none';
  c.style.transform=`translateX(${dist}px) rotate(${dir*14}deg)`; c.style.opacity='0';
  setTimeout(()=>{
    answer(res); S.busy=false;
    if(S.i>=S.queue.length){ flushAll(); state.view='summary'; renderSummary(); return; }
    resetCardStyle(); sync(true);
  },ms);
}
function bindCard(card){
  let d=null;
  card.addEventListener('pointerdown',e=>{
    if(S.busy||(e.pointerType==='mouse'&&e.button!==0)) return;
    d={x:e.clientX,t:performance.now(),dx:0,id:e.pointerId};
    try{card.setPointerCapture(e.pointerId);}catch(x){}
    card.style.transition='none';
  });
  card.addEventListener('pointermove',e=>{
    if(!d||e.pointerId!==d.id) return;
    d.dx=e.clientX-d.x;
    card.style.transform=`translateX(${d.dx}px) rotate(${d.dx/22}deg)`;
    const th=Math.min(120,card.offsetWidth*.25), o=Math.min(1,Math.abs(d.dx)/th);
    UI.tintGood.style.opacity=d.dx<0?o:0; UI.tintBad.style.opacity=d.dx>0?o:0;
  });
  const end=e=>{
    if(!d||e.pointerId!==d.id) return;
    const dx=d.dx, dt=Math.max(1,performance.now()-d.t), v=dx/dt; d=null;
    const th=Math.min(120,card.offsetWidth*.25);
    if(Math.abs(dx)>th||(Math.abs(dx)>40&&Math.abs(v)>.5)){ commit(dx<0?'k':'u'); return; }
    if(Math.abs(dx)<6&&dt<400){ resetCardStyle(); S.flipped=!S.flipped; card.classList.toggle('flipped',S.flipped); return; }
    card.style.transition=reduceMotion()?'none':'transform .2s ease'; card.style.transform=''; UI.tintGood.style.opacity='0'; UI.tintBad.style.opacity='0';
  };
  card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
}
document.addEventListener('keydown',e=>{
  if(state.view!=='study'||!S||e.ctrlKey||e.metaKey||e.altKey) return;
  const t=e.target; if(t&&(t.tagName==='INPUT'&&t.type!=='range'||t.tagName==='TEXTAREA')) return;
  if(t&&t.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter')) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); commit('k'); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); commit('u'); }
  else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); S.flipped=!S.flipped; UI.card.classList.toggle('flipped',S.flipped); }
  else if(e.key==='z'||e.key==='Z'||e.key==='Backspace'){ e.preventDefault(); undo(); }
});

function renderSummary(){
  const u=unit(); const root=clear();
  const unknownIds=S.queue.filter(id=>S.answers[id]==='u');
  const c=counts(u);
  root.append(h('div',{class:'summary'},
    h('div',{},h('h1',{text:'這一輪完成了'}),h('p',{class:'sub',text:u.name})),
    h('div',{class:'nums'},
      h('div',{class:'stat k'},h('span',{class:'v',text:S.count.k}),h('span',{class:'l',text:'會'})),
      h('div',{class:'stat u'},h('span',{class:'v',text:S.count.u}),h('span',{class:'l',text:'不會'}))),
    stripe(u),legend(c),
    unknownIds.length?h('button',{class:'btn primary block',onclick:()=>startStudy('unknown',unknownIds.slice().sort((a,b)=>a-b))},'再複習不會的 '+unknownIds.length+' 字'):null,
    h('button',{class:'btn block',onclick:()=>startStudy('all')},'重新開始（全部）'),
    h('button',{class:'btn block',onclick:()=>go('unit')},'回到單元'),
    h('button',{class:'btn block',onclick:undo},ic('undo'),'復原最後一張')));
}

/* ---------- boot ---------- */
render();
initStorage().then(()=>{ state.view='home'; render(); });
})();
</script>
